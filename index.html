<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundScape3D - Spatial Audio Localization</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas { display: block; }

    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
    }

    .btn {
      background: linear-gradient(180deg, #4080ff 0%, #2060d0 100%);
      color: #fff;
      border: 2px solid #6090ff;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
      transition: all 0.2s;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(64, 128, 255, 0.4);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 14px;
      color: #aaa;
      max-width: 300px;
    }

    #audio-viz {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 4px;
      align-items: flex-end;
    }
    .mic-level {
      width: 20px;
      height: 100px;
      background: #222;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
    }
    .mic-level-fill {
      background: linear-gradient(180deg, #ff4040 0%, #40ff40 50%, #40ff40 100%);
      width: 100%;
      transition: height 0.05s;
    }
    .mic-label {
      font-size: 10px;
      text-align: center;
      color: #666;
    }

    #sources-list {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      border-radius: 8px;
      padding: 10px;
      min-width: 200px;
    }
    #sources-list h3 {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }
    .source-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 12px;
    }
    .source-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="ui-overlay">
      <button class="btn" id="start-btn">Start Listening</button>
      <button class="btn" id="ar-btn" disabled>Enter AR</button>
    </div>

    <div id="status">Click "Start Listening" to begin</div>

    <div id="audio-viz">
      <!-- Mic level meters will be added dynamically -->
    </div>

    <div id="sources-list">
      <h3>DETECTED SOURCES</h3>
      <div id="sources-container">
        <div style="color: #666; font-size: 11px;">No sources detected</div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
