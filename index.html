<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundScape3D - Spatial Audio Localization</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas { display: block; }

    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
    }

    .btn {
      background: linear-gradient(180deg, #4080ff 0%, #2060d0 100%);
      color: #fff;
      border: 2px solid #6090ff;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
      transition: all 0.2s;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(64, 128, 255, 0.4);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 14px;
      color: #aaa;
      max-width: 300px;
    }

    #audio-viz {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 4px;
      align-items: flex-end;
    }
    .mic-level {
      width: 20px;
      height: 100px;
      background: #222;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
    }
    .mic-level-fill {
      background: linear-gradient(180deg, #ff4040 0%, #40ff40 50%, #40ff40 100%);
      width: 100%;
      transition: height 0.05s;
    }
    .mic-label {
      font-size: 10px;
      text-align: center;
      color: #666;
    }

    #sources-list {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      border-radius: 8px;
      padding: 10px;
      min-width: 200px;
    }
    #sources-list h3 {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }
    .source-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 12px;
    }
    .source-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    /* New audio controls styling */
    .audio-controls {
      position: absolute;
      top: 80px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 8px;
    }
    .control-btn {
      background: linear-gradient(180deg, #6060ff 0%, #4040c0 100%);
      color: #fff;
      border: 2px solid #8080ff;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .control-btn:hover:not(:disabled) {
      transform: scale(1.03);
      box-shadow: 0 2px 8px rgba(96, 96, 255, 0.4);
    }
    .control-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .control-btn.active {
      background: linear-gradient(180deg, #ff6060 0%, #c04040 100%);
      border-color: #ff8080;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #ccc;
      cursor: pointer;
    }
    .toggle-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .source-item.selected {
      background: rgba(64, 128, 255, 0.3);
      border-radius: 4px;
      padding: 4px 8px;
      margin: -4px -8px;
    }
    .source-item.carrier {
      border-left: 3px solid #ff40ff;
      padding-left: 8px;
    }
    .carrier-freq {
      color: #ff80ff;
      font-size: 10px;
    }
    .carrier-indicator {
      animation: carrier-pulse 1s infinite;
      box-shadow: 0 0 8px #ff40ff;
    }
    @keyframes carrier-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.3); }
    }
    .source-transcript {
      font-size: 10px;
      color: #88ff88;
      font-style: italic;
      margin-left: 20px;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .source-item {
      flex-wrap: wrap;
    }
    .recording-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .record-btn.recording {
      background: linear-gradient(180deg, #ff3030 0%, #cc2020 100%);
      border-color: #ff5050;
      animation: recording-pulse 1s infinite;
    }
    @keyframes recording-pulse {
      0%, 100% { box-shadow: 0 0 5px #ff3030; }
      50% { box-shadow: 0 0 15px #ff3030; }
    }
    #format-select, #depth-composite-select {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      margin-left: 8px;
    }
    #format-select:disabled, #depth-composite-select:disabled {
      opacity: 0.5;
    }
    .passthrough-note {
      font-size: 9px;
      color: #666;
      margin-top: 4px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="ui-overlay">
      <button class="btn" id="start-btn">Start Listening</button>
      <button class="btn" id="ar-btn" disabled>Enter AR</button>
    </div>

    <div id="status">Click "Start Listening" to begin</div>

    <div id="audio-viz">
      <!-- Mic level meters will be added dynamically -->
    </div>

    <div id="sources-list">
      <h3>DETECTED SOURCES</h3>
      <div id="sources-container">
        <div style="color: #666; font-size: 11px;">No sources detected</div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
